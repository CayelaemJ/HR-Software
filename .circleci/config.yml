version: 2.1

jobs:
  security_and_tests:
    docker:
      - image: cimg/node:22.16
    resource_class: small
    steps:
      - checkout
      - run:
          name: Test and scan committed credentials (redacted output)
          command: node --test scripts/security/scan-secrets.test.mjs && node scripts/security/scan-secrets.mjs
      - run:
          name: Install dependencies
          command: npm install --no-audit --no-fund
      - run:
          name: Reject high-severity production dependency advisories
          command: npm audit --omit=dev --audit-level=high
      - run:
          name: Typecheck and build
          command: npm run typecheck && npm run build
      - run:
          name: Authentication and security regression tests
          command: npm test

workflows:
  verify_pull_requests_and_main:
    jobs:
      - security_and_tests
