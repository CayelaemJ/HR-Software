name: Phase 1 checks
on:
  pull_request:
  push:
    branches: [main, feat/phase1-render-neon-foundation]
jobs:
  build_and_test:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-test-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
