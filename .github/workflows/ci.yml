name: CABO Human Capital quality gates
on:
  pull_request:
  push:
    branches: [main, feat/phase1-render-neon-foundation]
jobs:
  build_and_test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cabo_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d cabo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SESSION_SECRET: ci-test-secret-with-at-least-thirty-two-characters
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cabo_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run db:migrate
      - run: node scripts/verify-rls.mjs
      - run: node scripts/verify-recruitment.mjs
      - run: node scripts/verify-cvs.mjs
      - run: node scripts/verify-demo.mjs
      - run: node scripts/verify-hr.mjs
      - run: node scripts/verify-employee.mjs
      - run: node scripts/verify-fairness.mjs
      - run: node scripts/verify-privacy.mjs
      - run: node scripts/verify-careers.mjs
      - run: node scripts/verify-platform.mjs
