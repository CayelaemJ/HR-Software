name: HR Software dependency audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve locked audit dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Reject high and critical dependency advisories
        run: npm audit --audit-level=high
