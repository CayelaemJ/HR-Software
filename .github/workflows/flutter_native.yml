name: CABO native Flutter validation

on:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter_native.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter_native.yml'

permissions:
  contents: read

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name cabo_human_capital --platforms android,ios,windows,macos,linux
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android_debug:
    needs: analyze_and_test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name cabo_human_capital --platforms android
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: cabo-human-capital-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk

  windows_debug:
    needs: analyze_and_test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name cabo_human_capital --platforms windows
      - run: flutter pub get
      - run: flutter build windows --debug

  macos_unsigned:
    needs: analyze_and_test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name cabo_human_capital --platforms ios,macos
      - run: flutter pub get
      - run: flutter build ios --no-codesign
      - run: flutter build macos --debug

  linux_debug:
    needs: analyze_and_test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter create . --project-name cabo_human_capital --platforms linux
      - run: flutter pub get
      - run: flutter build linux --debug
