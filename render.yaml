# Optional Render Blueprint configuration for CABO Human Capital.
# Create a Render web service for the app; the database is ALWAYS Neon (not Render Postgres).
services:
  - type: web
    name: cabo-human-capital
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_TOKEN
        sync: false
